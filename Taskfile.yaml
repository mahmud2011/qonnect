version: "3"

vars:
  KIND_IMAGE: kindest/node:v1.33.0
  NUM_CLOUD_CLUSTERS: '{{default "3" .NUM_CLOUD_CLUSTERS}}'
  NUM_FOG_CLUSTERS: '{{default "3" .NUM_FOG_CLUSTERS}}'
  NUM_EDGE_CLUSTERS: '{{default "3" .NUM_EDGE_CLUSTERS}}'
  NUM_RAFT_CLUSTERS: '{{default "3" .NUM_RAFT_CLUSTERS}}'
  NUM_CLUSTERS:
    sh: echo $(( {{.NUM_CLOUD_CLUSTERS}} + {{.NUM_FOG_CLUSTERS}} + {{.NUM_EDGE_CLUSTERS}} ))
  OS:
    sh: uname

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  kb:
    desc: Start knowledge-base docker setup
    dir: knowledge-base
    cmds:
      - docker compose up -d
      - until docker exec postgres pg_isready -U foo -d knowledge_base; do echo "Waiting for database..."; sleep 3; done
      - migrate -database "postgres://foo:pass@localhost:5432/knowledge_base?sslmode=disable" -path ./migrations up

  swagger:
    desc: Generate swagger spec
    dir: resource-lead-agent
    cmds:
      - swag init --parseDependency --parseInternal --parseDepth 1 -md ./documentation -o ./swagger

  kind:create:
    desc: Create all kind clusters (Cloud={{.NUM_CLOUD_CLUSTERS}}, Fog={{.NUM_FOG_CLUSTERS}}, Edge={{.NUM_EDGE_CLUSTERS}})
    vars:
      PROFILES: energy cost performance
    cmds:
      - |
        PROFILES=(energy cost performance)
        CPU_LIMIT="0.4"
        MEM_LIMIT="1g"
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}
        NUM_FOG={{.NUM_FOG_CLUSTERS}}
        NUM_CLUSTERS={{.NUM_CLUSTERS}}

        for i in $(seq 1 ${NUM_CLUSTERS}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          echo "Creating cluster: ${NAME}"

          if [ "$PROFILE" = "performance" ]; then
            CONFIG_FILE="config/kind-config.yaml"
          else
            CONFIG_FILE="config/kind-config-reduced.yaml"
          fi

          kind create cluster --config "${CONFIG_FILE}" --name "${NAME}" --image="{{.KIND_IMAGE}}"

          for node in "${NAME}-control-plane" "${NAME}-worker"; do
            echo "Applying limits to $node (CPU=${CPU_LIMIT}, MEM=${MEM_LIMIT})"
            docker update --cpus="${CPU_LIMIT}" --memory="${MEM_LIMIT}" --memory-swap="${MEM_LIMIT}" "$node"
          done

          if [ "{{.OS}}" != "Darwin" ]; then
            docker_ip=$(docker inspect --format='{{`{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}`}}' "${NAME}-control-plane")
            kubectl config set-cluster "kind-${NAME}" --server="https://${docker_ip}:6443"
          fi

          kubectl config rename-context "kind-${NAME}" "${NAME}"

          echo "Labeling worker nodes for ${NAME}"

          case "$PROFILE" in
            energy)
              ENERGY="0.0024042"; PRICE="16.3884"; BANDWIDTH="52500000000" ;;
            cost)
              ENERGY="0.0025689"; PRICE="0.0042"; BANDWIDTH="5000000000" ;;
            performance)
              ENERGY="0.0027335"; PRICE="32.7726"; BANDWIDTH="100000000000" ;;
          esac

          kubectl label node "${NAME}-worker" \
            swarmchestrate.tu-berlin.de/energy="${ENERGY}" \
            swarmchestrate.tu-berlin.de/price="${PRICE}" \
            swarmchestrate.tu-berlin.de/bandwidth="${BANDWIDTH}" \
            swarmchestrate.tu-berlin.de/location="Europe_Berlin" --overwrite

          echo
        done

        kubectl config use-context cloud-energy
        cidr=$(docker network inspect -f '{{`{{(index .IPAM.Config 0).Subnet}}`}}' kind)
        echo "Kind CIDR is ${cidr}"

  kind:delete:
    desc: Delete all kind clusters
    cmds:
      - |
        PROFILES=(energy cost performance)
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}

        for i in $(seq 1 {{.NUM_CLUSTERS}}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          echo "Deleting cluster: ${NAME}"
          kubectl config rename-context "${NAME}" "kind-${NAME}" || true
          kind delete cluster --name "${NAME}"
        done

  metallb:
    desc: Deploy MetalLB in all clusters
    cmds:
      - |
        PROFILES=(energy cost performance)
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}
        IPS_PER_CLUSTER=5

        BASE_SUBNET=$(docker network inspect kind -f '{{`{{(index .IPAM.Config 0).Subnet}}`}}')
        echo "Base subnet: ${BASE_SUBNET}"
        BASE_IP=$(echo "${BASE_SUBNET}" | cut -d'.' -f1-3)
        START_OCTET=$(echo "${BASE_SUBNET}" | cut -d'.' -f4 | cut -d'/' -f1)

        for i in $(seq 1 {{.NUM_CLUSTERS}}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          echo "Deploying MetalLB in ${NAME}"
          kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml --context "${NAME}"
          kubectl wait --namespace metallb-system \
            --for=condition=ready pod \
            --selector=app=metallb \
            --timeout=300s \
            --context "${NAME}"

          START_IP=$((START_OCTET + (i - 1) * IPS_PER_CLUSTER + 1))
          END_IP=$((START_IP + IPS_PER_CLUSTER - 1))
          ADDR_RANGE="${BASE_IP}.${START_IP}-${BASE_IP}.${END_IP}"
          echo "${NAME} address range: ${ADDR_RANGE}"

          yq eval 'select(di == 0) | .spec.addresses = ["'"${ADDR_RANGE}"'"]' config/metallb-cr.yaml > /tmp/ipaddresspool.yaml
          yq eval 'select(di == 1)' config/metallb-cr.yaml > /tmp/l2advertisement.yaml

          kubectl apply -f /tmp/ipaddresspool.yaml --context "${NAME}"
          kubectl apply -f /tmp/l2advertisement.yaml --context "${NAME}"
          echo "----"
        done

  metallb:remove:
    desc: Remove MetalLB from all clusters
    cmds:
      - |
        PROFILES=(energy cost performance)
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}

        for i in $(seq 1 {{.NUM_CLUSTERS}}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          echo "Removing MetalLB from ${NAME}"
          kubectl delete ipaddresspool --all --namespace metallb-system --context "${NAME}" 2>/dev/null || true
          kubectl delete l2advertisement --all --namespace metallb-system --context "${NAME}" 2>/dev/null || true
          kubectl delete -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml --context "${NAME}" 2>/dev/null || true
          kubectl delete namespace metallb-system --context "${NAME}" --ignore-not-found
          echo "---"
        done

  ingress:
    desc: Deploy ingress controllers in all clusters
    cmds:
      - |
        PROFILES=(energy cost performance)
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}

        for i in $(seq 1 {{.NUM_CLUSTERS}}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          echo "Deploying ingress in ${NAME}"
          kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml --context "${NAME}"
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s \
            --context "${NAME}"
          echo "----"
        done

  ns:
    desc: Create swarmchestrate namespace in all clusters
    cmds:
      - |
        PROFILES=(energy cost performance)
        NUM_CLOUD={{.NUM_CLOUD_CLUSTERS}}

        for i in $(seq 1 {{.NUM_CLUSTERS}}); do
          if [ $i -le $NUM_CLOUD ]; then
            DOMAIN="cloud"
          elif [ $i -le $((NUM_CLOUD + {{.NUM_FOG_CLUSTERS}})) ]; then
            DOMAIN="fog"
          else
            DOMAIN="edge"
          fi

          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="${DOMAIN}-${PROFILE}"

          until kubectl --context "${NAME}" get namespace default >/dev/null 2>&1; do
            echo "Waiting for ${NAME} API server..."
            sleep 2
          done

          kubectl apply --validate=false -f config/ns.yaml --context "${NAME}"
          echo "----"
        done

  raft:lb:
    desc: Apply config/lb.yaml to first NUM_RAFT_CLUSTERS cloud clusters
    cmds:
      - |
        if [ "{{.NUM_RAFT_CLUSTERS}}" -gt "{{.NUM_CLOUD_CLUSTERS}}" ]; then
          echo "Error: NUM_RAFT_CLUSTERS cannot exceed NUM_CLOUD_CLUSTERS ({{.NUM_CLOUD_CLUSTERS}})"
          exit 1
        fi

        PROFILES=(energy cost performance)

        for i in $(seq 1 {{.NUM_RAFT_CLUSTERS}}); do
          PROFILE_INDEX=$(( (i - 1) % 3 ))
          PROFILE="${PROFILES[$PROFILE_INDEX]}"
          NAME="cloud-${PROFILE}"

          echo "Applying config/lb.yaml to ${NAME}"
          kubectl apply -f config/lb.yaml -n swarmchestrate --context "${NAME}"
        done

  all:
    desc: Full setup (kind:create → ingress → ns → raft:lb)
    cmds:
      - task: kind:create
      - task: ingress
      - task: ns
      - task: raft:lb
